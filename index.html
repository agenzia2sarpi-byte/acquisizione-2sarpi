<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acquisizione 2 Sarpi</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#B01F1F">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="2S Acquisizione">
<link rel="apple-touch-icon" href="icone/icona-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="icone/icona-180.png">
<link rel="icon" href="icone/icona-180.png">
<style>
:root{
  --rosso:#B01F1F; --rosso-scuro:#8E1818; --crema:#F7F5F0; --carta:#FFFDF8;
  --inchiostro:#1A1917; --grigio:#6B6862; --linea:#DFDACE; --verde:#2E7D4F;
  --ambra:#B7791F; --tenue:#F1EDE3;
  --serif:Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--crema);color:var(--inchiostro);font-family:var(--sans);font-size:15px;line-height:1.5;
     padding-bottom:env(safe-area-inset-bottom)}
a{color:var(--rosso)}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.2}
p{margin:0 0 .8em}

/* ---------- testata ---------- */
header.top{position:sticky;top:0;z-index:50;background:var(--carta);border-bottom:1px solid var(--linea);
  padding-top:env(safe-area-inset-top)}
.top .barra{height:5px;background:var(--rosso)}
.top .riga{display:flex;align-items:center;gap:10px;padding:9px 14px}
.marchio{display:flex;align-items:center;gap:9px;min-width:0}
.marchio .logo{width:30px;height:30px;border-radius:7px;background:var(--rosso);color:#F5F2EA;font-weight:900;
  display:flex;align-items:center;justify-content:center;font-size:14px;letter-spacing:-.5px;flex:0 0 auto}
.marchio .txt{min-width:0}
.marchio b{display:block;font-size:14px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marchio span{display:block;font-size:10px;color:var(--grigio);text-transform:uppercase;letter-spacing:.09em}
.top .spinta{margin-left:auto;display:flex;gap:6px;align-items:center;flex:0 0 auto}
select.mini,button.mini{font-family:var(--sans);font-size:12px;padding:5px 8px;border:1px solid var(--linea);
  background:var(--carta);border-radius:7px;color:var(--inchiostro);cursor:pointer}
select.mini{max-width:120px}
#salvato{font-size:11px;color:var(--verde);opacity:0;transition:opacity .3s;white-space:nowrap}
@media(max-width:620px){
  .marchio .txt span{display:none}
  .marchio b{font-size:13px}
  select.mini{max-width:105px;padding:5px 6px;font-size:11.5px}
}
@media(max-width:400px){ .marchio .txt{display:none} }
#salvato.on{opacity:1}

/* ---------- navigazione ---------- */
nav.tabs{position:sticky;top:0;z-index:40;background:var(--carta);border-bottom:1px solid var(--linea);
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs .interno{display:flex;gap:2px;padding:6px 10px;min-width:max-content}
nav.tabs button{font-family:var(--sans);font-size:12.5px;font-weight:600;white-space:nowrap;border:0;background:transparent;
  color:var(--grigio);padding:7px 11px;border-radius:8px;cursor:pointer}
nav.tabs button.attivo{background:var(--rosso);color:#fff}
nav.tabs .sep{width:1px;background:var(--linea);margin:4px 5px;flex:0 0 1px}

/* ---------- struttura ---------- */
main{max-width:960px;margin:0 auto;padding:16px 14px 90px}
section.vista{display:none}
section.vista.attiva{display:block}
.intestazione{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.intestazione h2{font-size:21px;letter-spacing:-.4px}
.intestazione .occhiello{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--rosso);font-weight:700}
.guida{font-family:var(--serif);font-size:14.5px;color:#3B3833;background:var(--tenue);border-left:3px solid var(--rosso);
  padding:11px 13px;border-radius:0 8px 8px 0;margin:0 0 16px}
.guida b{color:var(--inchiostro)}

.scheda{background:var(--carta);border:1px solid var(--linea);border-radius:11px;padding:14px;margin:0 0 12px}
.scheda>h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.scheda>h3 .etichetta{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--grigio)}
.griglia{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(125px,1fr))}

/* ---------- moduli ---------- */
label.campo{display:block;margin:0 0 9px}
label.campo>span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--grigio);
  font-weight:700;margin:0 0 3px}
input,select,textarea{width:100%;font-family:var(--sans);font-size:15px;padding:8px 10px;border:1px solid var(--linea);
  border-radius:8px;background:var(--carta);color:var(--inchiostro)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--rosso);outline-offset:-1px}
textarea{min-height:80px;resize:vertical;font-family:var(--serif);line-height:1.55}
button.azione{font-family:var(--sans);font-size:14px;font-weight:600;padding:9px 15px;border:0;border-radius:9px;
  background:var(--rosso);color:#fff;cursor:pointer}
button.azione.vuota{background:transparent;color:var(--rosso);border:1px solid var(--rosso)}
button.azione.grigia{background:var(--tenue);color:var(--inchiostro);border:1px solid var(--linea)}
button.azione:active{transform:translateY(1px)}
.bottoniera{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}

/* ---------- pezzi ---------- */
.dato{background:var(--carta);border:1px solid var(--linea);border-radius:10px;padding:11px 12px}
.dato .titolo{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--grigio);font-weight:700}
.dato .valore{font-size:23px;font-weight:800;letter-spacing:-.6px;margin:2px 0 0}
.dato .sotto{font-size:11.5px;color:var(--grigio)}
.dato.verde{border-color:#BFE0CC;background:#F3FAF5}
.dato.ambra{border-color:#EBD9AE;background:#FDF8EC}
.dato.rossa{border-color:#EFC9C9;background:#FDF2F2}

.pallino{display:inline-block;width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.pallino.v{background:var(--verde)} .pallino.a{background:var(--ambra)} .pallino.r{background:var(--rosso)}

.barra{height:7px;background:var(--tenue);border-radius:4px;overflow:hidden;margin:6px 0 0}
.barra i{display:block;height:100%;background:var(--rosso);border-radius:4px;transition:width .3s}
.barra i.v{background:var(--verde)} .barra i.a{background:var(--ambra)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--grigio);
  border-bottom:1px solid var(--linea);padding:7px 8px;font-weight:700;white-space:nowrap}
td{border-bottom:1px solid var(--linea);padding:8px;vertical-align:top}
tr:last-child td{border-bottom:0}
.tabellone{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

.riga-lead{background:var(--carta);border:1px solid var(--linea);border-radius:10px;padding:11px 12px;margin:0 0 8px}
.riga-lead .capo{display:flex;align-items:flex-start;gap:9px}
.riga-lead .capo b{font-size:15px}
.riga-lead .meta{font-size:12px;color:var(--grigio);margin:2px 0 0}
.punteggio{margin-left:auto;flex:0 0 auto;text-align:center;min-width:44px}
.punteggio b{display:block;font-size:19px;font-weight:800;line-height:1}
.punteggio span{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--grigio)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  padding:2px 7px;border-radius:20px;background:var(--tenue);color:var(--grigio);margin:4px 4px 0 0}
.tag.rosso{background:#FBEAEA;color:var(--rosso)}
.tag.verde{background:#EAF5EE;color:var(--verde)}
.tag.ambra{background:#FBF2DF;color:var(--ambra)}

details.blocco{border:1px solid var(--linea);border-radius:10px;background:var(--carta);margin:0 0 8px;overflow:hidden}
details.blocco>summary{cursor:pointer;padding:12px 14px;font-weight:700;font-size:14.5px;list-style:none;
  display:flex;align-items:center;gap:9px}
details.blocco>summary::-webkit-details-marker{display:none}
details.blocco>summary::after{content:'+';margin-left:auto;color:var(--rosso);font-size:19px;font-weight:400}
details.blocco[open]>summary::after{content:'–'}
details.blocco>summary .num{font-size:10.5px;font-weight:800;color:var(--rosso);font-variant-numeric:tabular-nums}
details.blocco .corpo{padding:0 14px 14px;font-family:var(--serif);font-size:14.5px;line-height:1.62}
details.blocco .corpo h4{font-family:var(--sans);font-size:13px;margin:14px 0 5px;letter-spacing:-.1px}
details.blocco .corpo ul{margin:0 0 10px;padding-left:19px}
details.blocco .corpo li{margin:0 0 5px}

.spunta{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px solid var(--linea)}
.spunta:last-child{border-bottom:0}
.spunta input[type=checkbox]{width:19px;height:19px;flex:0 0 19px;margin:1px 0 0;accent-color:var(--rosso)}
.spunta .testo{font-size:14px;line-height:1.45}
.spunta .testo small{display:block;color:var(--grigio);font-size:11.5px;margin:2px 0 0}
.spunta.fatto .testo{opacity:.45;text-decoration:line-through}

.copiabile{background:var(--tenue);border:1px solid var(--linea);border-radius:9px;padding:12px 13px;
  font-family:var(--serif);font-size:14.5px;line-height:1.62;white-space:pre-wrap}
.contatore{display:flex;align-items:center;gap:8px;background:var(--carta);border:1px solid var(--linea);
  border-radius:10px;padding:9px 11px}
.contatore .n{font-size:20px;font-weight:800;min-width:2ch;text-align:right;font-variant-numeric:tabular-nums}
.contatore .et{font-size:11.5px;line-height:1.25;flex:1}
.contatore button{width:31px;height:31px;border-radius:8px;border:1px solid var(--linea);background:var(--tenue);
  font-size:17px;font-weight:700;cursor:pointer;color:var(--inchiostro);flex:0 0 31px}
.contatore button.piu{background:var(--rosso);color:#fff;border-color:var(--rosso)}

.vuoto{text-align:center;color:var(--grigio);font-family:var(--serif);font-style:italic;padding:26px 12px;font-size:14.5px}
.piedino{text-align:center;color:var(--grigio);font-size:11.5px;padding:26px 10px 10px;border-top:1px solid var(--linea);margin:26px 0 0}
.avviso{background:#FDF8EC;border-left:3px solid var(--ambra);padding:11px 13px;border-radius:0 8px 8px 0;
  font-family:var(--serif);font-size:14px;margin:0 0 12px}
.avviso b{font-family:var(--sans);font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ambra);
  display:block;margin:0 0 4px}

/* ---------- finestra ---------- */
.velo{position:fixed;inset:0;background:rgba(26,25,23,.55);z-index:100;display:none;align-items:flex-end;justify-content:center}
.velo.on{display:flex}
.finestra{background:var(--crema);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:700px){.velo{align-items:center}.finestra{border-radius:14px;max-height:88vh}}
.finestra .capo{display:flex;align-items:center;gap:10px;margin:0 0 14px;position:sticky;top:-16px;background:var(--crema);
  padding:6px 0 8px;z-index:2}
.finestra .capo h3{font-size:17px;margin:0}
.finestra .capo button{margin-left:auto;background:transparent;border:0;font-size:25px;line-height:1;color:var(--grigio);cursor:pointer}

/* ---------- stampa ---------- */
.foglio{background:#fff;border:1px solid var(--linea);border-radius:8px;padding:26px;font-family:var(--serif);color:#111}
.foglio .testata{border-top:4px solid var(--rosso);padding:12px 0 0;margin:0 0 18px}
.foglio h1{font-family:var(--sans);font-size:24px;letter-spacing:-.6px;margin:0 0 4px}
.foglio .occ{font-family:var(--sans);font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--rosso);font-weight:700}
.foglio table{font-family:var(--sans);font-size:12.5px}
.foglio .firma{border-top:1px solid #ddd;margin:22px 0 0;padding:12px 0 0;font-size:12.5px;font-family:var(--sans)}
@media print{
  header.top,nav.tabs,.nostampa{display:none!important}
  body{background:#fff}
  main{max-width:none;padding:0}
  .foglio{border:0;border-radius:0;padding:0}
  section.vista{display:none!important}
  section.vista.attiva{display:block!important}
  @page{size:A4;margin:14mm}
}
</style>
</head>
<body>

<header class="top">
  <div class="barra"></div>
  <div class="riga">
    <div class="marchio">
      <div class="logo">2S</div>
      <div class="txt">
        <b>Acquisizione 2 Sarpi</b>
        <span>Milano citta'</span>
      </div>
    </div>
    <div class="spinta">
      <span id="salvato">salvato</span>
      <select class="mini" id="selOperatore" title="Chi sta lavorando"></select>
      <select class="mini" id="selPiano" title="Piano attivo">
        <option value="500">Piano 500 €</option>
        <option value="1000">Piano 1.000 €</option>
      </select>
    </div>
  </div>
</header>

<nav class="tabs"><div class="interno" id="navTabs"></div></nav>

<main>
  <section class="vista" id="v-oggi"></section>
  <section class="vista" id="v-lead"></section>
  <section class="vista" id="v-sequenza"></section>
  <section class="vista" id="v-mandati"></section>
  <section class="vista" id="v-rete"></section>
  <section class="vista" id="v-gestione"></section>
  <section class="vista" id="v-kpi"></section>
  <section class="vista" id="v-rapporto"></section>
  <section class="vista" id="v-script"></section>
  <section class="vista" id="v-piano90"></section>
  <section class="vista" id="v-playbook"></section>
  <section class="vista" id="v-conformita"></section>
  <section class="vista" id="v-dati"></section>
  <div class="piedino nostampa">
    Agenzia 2 Sarpi · Piano operativo di acquisizione · Milano citta' · revisione 5<br>
    I dati restano su questo dispositivo. Nessun account, nessuna password, nessun server.
  </div>
</main>

<div class="velo" id="velo"><div class="finestra" id="finestra"></div></div>

<script src="contenuti.js"></script>
<script src="viste.js"></script>
<script src="app.js"></script>
</body>
</html>
